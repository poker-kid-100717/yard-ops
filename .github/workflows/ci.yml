name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    name: Publication safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/scan-for-sensitive.sh
      - run: bash -n scripts/cloudflare-deploy.sh

  backend:
    name: .NET 10 API and tests (SQLite and SQL Server)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Yard_Ci_Passw0rd!'
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/Portfolio.Yard.Api.Tests.csproj
      - name: Vulnerability report
        run: dotnet list api/Portfolio.Yard.Api.csproj package --vulnerable --include-transitive
      - run: dotnet build api/Portfolio.Yard.Api.csproj -c Release --no-restore
      - name: Tests (SQLite demo store)
        run: dotnet test tests/Portfolio.Yard.Api.Tests.csproj -c Release --no-restore
      - name: Tests (SQL Server, with migrations)
        run: dotnet test tests/Portfolio.Yard.Api.Tests.csproj -c Release --no-restore
        env:
          TEST_DATABASE_URL: 'Server=127.0.0.1,1433;Database=yard_test;User Id=sa;Password=Yard_Ci_Passw0rd!;TrustServerCertificate=True'
      - name: Migrations match the model
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes --project api

  frontend:
    name: Angular 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet

  cloudflare:
    name: Cloudflare deploy dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bash scripts/cloudflare-deploy.sh
        env:
          VALIDATE_ONLY: "true"
          APP_HOST: yard.example.com
          LTL_BASE_URL: https://ltl.example.com/
          YARD_LTL_SIGNING_KEY: dry-run-signing-key
          DATABASE_URL: 'Server=tcp:dry-run.database.windows.net,1433;Database=yard;User ID=dry-run;Password=dry-run;Encrypt=True'
          DEMO_RESET_TOKEN: dry-run-token
